worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # The token in a public link's address is a credential: it is never written to the access log.
  map $uri $logged_uri {
    default $uri;
    ~^/(?<kept>s|api/public)/[^/]+(?<rest>/.*)?$ /$kept/-$rest;
  }
  log_format minimal '$remote_addr $request_method $logged_uri $status $body_bytes_sent';
  access_log /dev/stdout minimal;
  server {
    listen 8443 ssl;
    ssl_certificate /run/tls/cert.pem;
    ssl_certificate_key /run/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 220m;
    proxy_read_timeout 300s;
    location = /healthz {
      access_log off;
      proxy_pass http://app:8080/healthz;
    }
    location / {
      proxy_pass http://app:8080;
      # Stream bodies straight through. The container's /tmp is a 16 MB tmpfs: buffering an upload (or a download
      # for a slow client) to a temp file there fails with 500 as soon as the file is larger than that. The app
      # enforces the upload limit itself while it reads.
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_max_temp_file_size 0;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      # Overwrite, never append: whatever X-Forwarded-For the client sent must not reach the app's rate limiter.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 300s;
    }
  }
}
