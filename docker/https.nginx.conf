worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  log_format minimal '$remote_addr $request_method $uri $status $body_bytes_sent';
  access_log /dev/stdout minimal;
  server {
    listen 8443 ssl;
    ssl_certificate /run/tls/cert.pem;
    ssl_certificate_key /run/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 220m;
    proxy_read_timeout 300s;
    # Optional login gate: compose.auth.yaml mounts docker/https-auth.conf (auth_basic + htpasswd) under /run/auth/.
    # A server-level include covers every path below, including the /joplin/api/ proxy; without the overlay the glob
    # matches nothing and the site stays open.
    include /run/auth/*.conf;
    location = /healthz {
      auth_basic off;
      access_log off;
      proxy_pass http://app:8080/healthz;
    }
    location / {
      proxy_pass http://app:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }
  }
}
