name: notes
services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "${NOTES_BIND:-127.0.0.1}:${NOTES_PORT:-8080}:8080"
    environment:
      TRUST_PROXY: "${NOTES_TRUST_PROXY:-0}"
      PUBLIC_ORIGIN: "${NOTES_PUBLIC_ORIGIN:-}"
      MAX_UPLOAD_MB: "${NOTES_MAX_UPLOAD_MB:-20}"
      MAX_IMPORT_MB: "${NOTES_MAX_IMPORT_MB:-200}"
    volumes:
      - notes-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  notes-data: {}
