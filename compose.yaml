name: notes
services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "${NOTES_BIND:-127.0.0.1}:${NOTES_PORT:-8080}:8080"
    environment:
      TRUST_PROXY: "${NOTES_TRUST_PROXY:-0}"
      PUBLIC_ORIGIN: "${NOTES_PUBLIC_ORIGIN:-}"
      MAX_UPLOAD_MB: "${NOTES_MAX_UPLOAD_MB:-90}"
      MAX_IMPORT_MB: "${NOTES_MAX_IMPORT_MB:-200}"
      MAX_ACCOUNT_STORAGE_MB: "${NOTES_MAX_ACCOUNT_STORAGE_MB:-0}"
      CLIENT_IP_HEADER: "${NOTES_CLIENT_IP_HEADER:-}"
      SETUP_TOKEN: "${NOTES_SETUP_TOKEN:-}"
    volumes:
      - notes-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # 0 = no limit. With a limit, a runaway process is restarted instead of taking the host's memory with it.
    mem_limit: "${NOTES_MEMORY_LIMIT:-0}"
    restart: unless-stopped
volumes:
  notes-data: {}
